# A Fount Cloud coordinator enclave, P2's first slice (fount m4-cloud-runners.md
# §7): it queues jobs and sends each over the attested link to a runner enclave
# measured from FOUNT_RUNNER_REPO's releases. The deployed copy is public
# fount-labs/fount-cloud-coordinator, the repo runners pin with
# FOUNT_COORDINATOR_REPO.
#
# TEST DATA ONLY. Its ways in are the attested client channel (--client-listen),
# which takes dev fount-infra's credentials and grants naming this enclave's
# origin, and the dev API behind a bearer token (--test-api), both on the shim's
# one port. Its wrapping key is the dev one (--wrapping-key dev), made at boot
# in the state volume. It must say dev: vault is the default and refuses --test-api,
# and the real coordinators take theirs from the Cloud vaults.
cvm-version: 0.14.19 # https://github.com/tinfoilsh/cvmimage/releases/latest, no `v`
cpus: 4
memory: 16384

attested-keys:
  # Its end of the link to runners (internal/link); runners declare the same id.
  - id: fount-link
    key: ed25519
  # Signs each job's credential (internal/jobcred). The proxy learns it from
  # this enclave's attestation (fount-infra proxy-server/coordinator-keys.ts).
  - id: job-signing
    key: ed25519
  # Its end of the attested client channel (internal/channel): the TLS key
  # Desktop's broker checks against this repo's releases.
  - id: fount-client
    key: ed25519

networks:
  coordinator-out:
    egress: allowlist
    allow:
      # The runner enclaves. Checking a runner needs no other hosts: a V3
      # document carries its own collateral, verified offline.
      - runner-a.fount.containers.tinfoil.dev

containers:
  - name: coordinator
    image: "ghcr.io/fount-labs/fount-broker/coordinator@sha256:54d52962b5ad58ee60d22501de58e6b9bfcda3370f165217d1e526b51df45e86" # fount-broker v0.5.6
    networks: [coordinator-out]
    keys: [fount-link, job-signing, fount-client]
    attestation: true
    restart: always
    command:
      - "--dir"
      - "/state"
      - "--runner-addr"
      - "https://runner-a.fount.containers.tinfoil.dev"
      - "--runners"
      - "1"
      - "--slots"
      - "16" # the runner's fount-supervisor --max-jobs
      - "--account-jobs"
      - "12" # one account's Tinfoil key: about 3-6 model calls a minute a job
      - "--wrapping-key"
      - "dev"
      - "--test-api"
      - "--listen"
      - "127.0.0.1:8790" # the shim reaches the test API on the client port
      - "--client-listen"
      - "0.0.0.0:8792"
      - "--client-audience"
      - "https://coordinator-a.fount.containers.tinfoil.dev"
      # Hour-long Cloud credentials only, not 7-day device ones, so a device
      # fount-infra revokes, or an account whose Cloud lapses, is shut out
      # within the hour.
      - "--cloud-credentials-only"
    volumes:
      - state:/state
    env:
      - FOUNT_RUNNER_REPO: "fount-labs/fount-cloud-runner"
      # Dev fount-infra's credential-signing key (KMS, RSA 2048), SPKI DER as
      # base64: device and Cloud credentials it signs open the channel.
      - FOUNT_ACCOUNT_KEYS: ""
    secrets:
      # The test API's bearer token, 32 random bytes as hex.
      - FOUNT_TEST_API_TOKEN
    healthcheck:
      test: ["CMD", "/fount-coordinator", "health", "http://127.0.0.1:8792/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 1m

shim:
  upstream-port: 8792
  upstream-container: coordinator
  paths:
    - /health
    - /status
    - /fount-client # the client channel, an HTTP upgrade
    - /v0/* # the test API, behind its bearer token
