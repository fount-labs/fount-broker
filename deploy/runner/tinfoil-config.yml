# The working copy of a Cloud runner enclave (m4-cloud-runners.md
# §5.1c). Its live copy is github.com/fount-labs/fount-cloud-runner, which the
# coordinator pins with --runner-repo.
#
# TEST RUNNER from v0.2.0: its broker is the dev build (broker-dev), whose
# jobs reach the dev proxy (FOUNT_BROKER_PROXY), and it takes jobs only from
# the test coordinators of fount-labs/fount-cloud-coordinator. Test data only.
cvm-version: 0.14.19 # https://github.com/tinfoilsh/cvmimage/releases/latest, no `v`
cpus: 8
memory: 32768

# The link's per-boot key (internal/link). The coordinator's enclave declares
# the same id for its own end.
attested-keys:
  - id: fount-link
    key: ed25519

networks:
  broker-out:
    egress: allowlist
    allow:
      - dev-api.fount.sh # the dev proxy: inference with the job's credential
      - websearch.tinfoil.sh
      - ghcr.io # the harness pull
      - pkg-containers.githubusercontent.com
      # The coordinator: the runner dials in for its jobs (--coordinator), as a
      # coordinator's measured allowlist can't name a runner that may be
      # stopped (launch plan work R).
      - coordinator-a.fount.containers.tinfoil.dev
      # Checking the coordinator needs no hosts: a V3 document carries its
      # own collateral (Sigstore bundles, AMD VCEK and CRL, Intel PCS), and
      # tinfoil-go verifies it offline against embedded roots.

containers:
  - name: broker
    image: "ghcr.io/fount-labs/fount-broker/broker-dev@sha256:9553473de4ac984f439031bc535c3c2a3fc216b3808a14bbf3f71fd38b303ee6" # v0.5.3, -tags dev
    networks: [broker-out]
    keys: [fount-link]
    # The link sends this enclave's document; the coordinator checks it.
    attestation: true
    restart: always
    command: ["runner", "--listen", "0.0.0.0:7400", "--coordinator", "https://coordinator-a.fount.containers.tinfoil.dev"]
    volumes:
      - harness-blobs:/harness-blobs
      - sockets:/sockets
    env:
      - FOUNT_COORDINATOR_REPO: "fount-labs/fount-cloud-coordinator" # its releases are the only coordinator it takes jobs from
      # The dev proxy, which takes the test coordinators' job credentials. Read
      # only by the dev build (fount-broker internal/policy/endpoints_dev.go).
      - FOUNT_BROKER_PROXY: "https://dev-api.fount.sh"
      - FOUNT_BROKER_FOUNT_API: "https://dev-api.fount.sh"
      - FOUNT_HARNESS_IMAGE: "ghcr.io/fount-labs/fount-runner@sha256:2984c2c42148d6f3c45120644815f0954e0b8a1ae84a1b3d5e206ae83641cee3" # fount-app be741a3e
    secrets:
      # Read-only, for the private harness (fount's runner-image workflow
      # publishes it).
      - FOUNT_BROKER_REGISTRY_TOKEN
    # /health answers as soon as the broker listens, before its harness pull:
    # Tinfoil's boot gate wants it within about a minute, whatever
    # start_period says. /status shows the pull and the supervisor; the link
    # takes jobs only once both are ready.
    healthcheck:
      test: ["CMD", "/fount-broker", "health", "http://127.0.0.1:7400/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 1m

  - name: supervisor
    image: "ghcr.io/fount-labs/fount-broker/supervisor@sha256:0a8ef1864f44a5aadf30d7678d0706db70644bffd7d7febdba3cf1fc0ebda374" # v0.5.3
    # runsc needs it (§5.1b). It has authority over the whole enclave,
    # including the broker's fount-link key, so its image is open and pinned.
    cvm_admin: true
    networks: []
    restart: always
    # 32 at once with 2 cores each is the ramp's ceiling (fount m4-cloud-runners.md
    # §5.2a), not a sizing: the caps overcommit memory on purpose, to find the knee.
    command: ["serve", "--image", "sha256:2984c2c42148d6f3c45120644815f0954e0b8a1ae84a1b3d5e206ae83641cee3", "--max-jobs", "16", "--cpus", "2"]
    volumes:
      - harness-blobs:/harness-blobs
      - sockets:/sockets
      - jobs:/jobs # each job's folders (--jobs)

shim:
  upstream-port: 7400
  upstream-container: broker
  paths:
    - /health
    - /status
    # No /fount-link: jobs come over links this runner dials.
