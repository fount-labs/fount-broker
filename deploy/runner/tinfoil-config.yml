# The working copy of a Cloud runner enclave (m4-cloud-runners.md
# §5.1c). Its live copy is github.com/fount-labs/fount-cloud-runner, which the
# coordinator pins with --runner-repo.
cvm-version: 0.14.18 # https://github.com/tinfoilsh/cvmimage/releases/latest, no `v`
cpus: 8
memory: 32768

# The link's per-boot key (internal/link). The coordinator's enclave declares
# the same id for its own end.
attested-keys:
  - id: fount-link
    key: ed25519

networks:
  broker-out:
    egress: allowlist
    allow:
      - api.fount.sh # the proxy: inference with the job's minted license
      - websearch.tinfoil.sh
      - ghcr.io # the harness pull
      - pkg-containers.githubusercontent.com
      # Checking the coordinator needs no hosts: a V3 document carries its
      # own collateral (Sigstore bundles, AMD VCEK and CRL, Intel PCS), and
      # tinfoil-go verifies it offline against embedded roots.

containers:
  - name: broker
    image: "ghcr.io/fount-labs/fount-broker/broker@sha256:97b520db9021958b8fb36c726521dfe0d4529b0f06ec67c0f7897a8ab4ff9b59" # v0.5.2
    networks: [broker-out]
    keys: [fount-link]
    # The link sends this enclave's document; the coordinator checks it.
    attestation: true
    restart: always
    command: ["runner", "--listen", "0.0.0.0:7400"]
    volumes:
      - harness-blobs:/harness-blobs
      - sockets:/sockets
    env:
      - FOUNT_COORDINATOR_REPO: "fount-labs/fount-cloud-coordinator" # its releases are the only coordinator it takes jobs from
      - FOUNT_HARNESS_IMAGE: "ghcr.io/fount-labs/fount-runner@sha256:2984c2c42148d6f3c45120644815f0954e0b8a1ae84a1b3d5e206ae83641cee3" # fount-app be741a3e
    secrets:
      # Read-only, for the private harness (fount's runner-image workflow
      # publishes it).
      - FOUNT_BROKER_REGISTRY_TOKEN
    # /health answers as soon as the broker listens, before its harness pull:
    # Tinfoil's boot gate wants it within about a minute, whatever
    # start_period says. /status shows the pull and the supervisor; the link
    # takes jobs only once both are ready.
    healthcheck:
      test: ["CMD", "/fount-broker", "health", "http://127.0.0.1:7400/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 1m

  - name: supervisor
    image: "ghcr.io/fount-labs/fount-broker/supervisor@sha256:6890a96943d546db663c3430fac679f491c044900720e93ce4877ba8a245d325" # v0.5.2
    # runsc needs it (§5.1b). It has authority over the whole enclave,
    # including the broker's fount-link key, so its image is open and pinned.
    cvm_admin: true
    networks: []
    restart: always
    # 32 at once with 2 cores each is the ramp's ceiling (fount m4-cloud-runners.md
    # §5.2a), not a sizing: the caps overcommit memory on purpose, to find the knee.
    command: ["serve", "--image", "sha256:2984c2c42148d6f3c45120644815f0954e0b8a1ae84a1b3d5e206ae83641cee3", "--max-jobs", "32", "--cpus", "2"]
    volumes:
      - harness-blobs:/harness-blobs
      - sockets:/sockets
      - jobs:/jobs # each job's folders (--jobs)

shim:
  upstream-port: 7400
  upstream-container: broker
  paths:
    - /health
    - /status
    - /fount-link
